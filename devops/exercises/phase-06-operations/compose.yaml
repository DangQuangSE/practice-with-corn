services:
  api:
    build:
      context: ../../../java-business-rules/exercises/phase-02-rest-foundations
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18.6-alpine
    profiles: ["support"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practice}
      POSTGRES_USER: ${POSTGRES_USER:-practice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - phase06_pg_data:/var/lib/postgresql
      - ../../../sql-practice/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../../sql-practice/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres-readiness-check:
    image: postgres:18.6-alpine
    profiles: ["support"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practice}
      POSTGRES_USER: ${POSTGRES_USER:-practice}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["pg_isready -h postgres -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]

  redis:
    image: redis:7.4.11-alpine3.21
    profiles: ["support"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: ["support"]
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

  object-store:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["object-store"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-practice-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${OBJECT_API_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_CONSOLE_PORT:-9001}:9001"
    volumes:
      - phase06_object_data:/data

volumes:
  phase06_pg_data:
  phase06_object_data:
