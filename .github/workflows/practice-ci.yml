name: Practice build checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  java-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - java-business-rules/exercises/phase-02-rest-foundations
          - java-business-rules/exercises/phase-03-data-access
          - java-business-rules/exercises/phase-04-identity-security
          - java-business-rules/exercises/phase-04-browser-session
          - java-business-rules/exercises/phase-05-order-workflows
          - java-business-rules/exercises/phase-05-safe-upload
          - java-business-rules/exercises/phase-05-import-report
          - java-business-rules/exercises/phase-07-service-boundaries
          - java-business-rules/exercises/phase-07-redis-cache
          - java-business-rules/exercises/phase-07-rabbitmq
          - java-business-rules/exercises/phase-07-cloudinary-upload
          - java-business-rules/exercises/phase-07-websocket
          - java-business-rules/exercises/phase-08-payments
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package scaffold
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode -DskipTests package

  next-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - nextjs-business-rules/exercises/phase-02-next-foundations
          - nextjs-business-rules/exercises/phase-04-access-states
          - nextjs-business-rules/exercises/phase-05-workflow-ui
          - nextjs-business-rules/exercises/phase-07-integration-ui
          - nextjs-business-rules/exercises/phase-08-payment-ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json
      - name: Install from lockfile
        working-directory: ${{ matrix.module }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.module }}
        run: npm run typecheck
      - name: Production build
        working-directory: ${{ matrix.module }}
        run: npm run build
