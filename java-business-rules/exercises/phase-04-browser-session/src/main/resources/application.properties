spring.application.name=phase-04-browser-session
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8081}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}
practice.user.username=${PRACTICE_USER:learner}
practice.user.password=${PRACTICE_USER_PASSWORD}
