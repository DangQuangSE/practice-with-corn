services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only password in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - practice_pg_data:/var/lib/postgresql
      - ./schema.sql:/workspace/schema.sql:ro
      - ./seed.sql:/workspace/seed.sql:ro
      - ./sql_demo.sql:/workspace/sql_demo.sql:ro
      - ./migrations:/workspace/migrations:ro
      - ./exercises:/workspace/exercises:ro

volumes:
  practice_pg_data:
